<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 6px;
      background: transparent;
    }
    .folder-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .folder-btn {
      background: #ff4b4b;
      color: white;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      font-size: 16px;
      box-shadow: 0 3px 8px rgba(255, 75, 75, 0.3);
      user-select: none;
      transition: all 0.2s ease;
      border: none;
    }
    .folder-btn:hover {
      background: #d93838;
      box-shadow: 0 4px 12px rgba(217, 56, 56, 0.4);
    }
    .folder-btn:active {
      transform: scale(0.98);
    }
    #status {
      font-size: 14px;
      color: #111;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="folder-btn-wrapper">
    <label class="folder-btn" for="nativeFolderInput">
      📁 Click Here to Choose Folder from External Drive
    </label>
    <input type="file" id="nativeFolderInput" webkitdirectory directory multiple style="display:none;" onchange="processFolder(this.files)">
    <div id="status"></div>
  </div>

  <script>
    function setComponentReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
    }

    function setFrameHeight(height) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
      }, "*");
    }

    function setComponentValue(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
      }, "*");
    }

    function processFolder(files) {
      const statusDiv = document.getElementById("status");
      if (!files || files.length === 0) {
        statusDiv.innerHTML = "No folder selected.";
        return;
      }

      const validExts = [".jpg", ".jpeg", ".png", ".webp"];
      const imageFiles = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const lowerName = file.name.toLowerCase();
        if (validExts.some(ext => lowerName.endsWith(ext))) {
          imageFiles.push(file);
        }
      }

      if (imageFiles.length === 0) {
        statusDiv.innerHTML = "⚠️ No image files (.jpg, .png, .webp) found in selected folder.";
        return;
      }

      statusDiv.innerHTML = `⏳ Reading ${imageFiles.length} image(s) from folder...`;

      const results = [];
      let loadedCount = 0;

      for (let i = 0; i < imageFiles.length; i++) {
        const file = imageFiles[i];
        const reader = new FileReader();

        reader.onload = function(e) {
          const dataUrl = e.target.result;
          const b64 = dataUrl.split(",")[1] || "";
          
          results.push({
            name: file.webkitRelativePath || file.name,
            mime: file.type || "image/jpeg",
            data_b64: b64,
            size: file.size
          });

          loadedCount++;
          statusDiv.innerHTML = `⏳ Loaded ${loadedCount} / ${imageFiles.length} images...`;

          if (loadedCount === imageFiles.length) {
            statusDiv.innerHTML = `✅ Selected ${results.length} images from folder!`;
            setComponentValue(results);
          }
        };

        reader.readAsDataURL(file);
      }
    }

    // Initialize component
    setComponentReady();
    setFrameHeight(120);
  </script>
</body>
</html>
