
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @page {
        size: A4 landscape;
        margin: 15mm 15mm 15mm 15mm;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #111111;
        background-color: #ffffff;
        margin: 0;
        padding: 0;
        -webkit-print-color-adjust: exact;
    }
    .page-item {
        page-break-after: always;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
    }
    .page-item:last-child {
        page-break-after: avoid;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1.5px solid #111111;
        padding-bottom: 10px;
        margin-bottom: 25px;
    }
    .brand-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    .header-date {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 1px;
        color: #222222;
        text-align: right;
    }
    .content-row {
        display: flex;
        gap: 35px;
        align-items: flex-start;
        flex: 1;
    }
    .gallery-grid {
        display: flex;
        gap: 15px;
        flex: 3;
    }
    .photo-wrapper {
        flex: 1;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fafafa;
        border: 1px solid #eaeaea;
        border-radius: 2px;
        overflow: hidden;
    }
    .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .sidebar-table-wrapper {
        flex: 1.1;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
    }
    .meta-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }
    .meta-table td {
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
        text-align: right;
    }
    .meta-table tr:last-child td {
        border-bottom: none;
    }
    .meta-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #777777;
        margin-bottom: 3px;
        display: block;
    }
    .meta-value {
        font-size: 15px;
        font-weight: 600;
        color: #111111;
        display: block;
    }
    .notes-box {
        margin-top: 15px;
        padding: 10px 12px;
        background-color: #f8f8f8;
        border-right: 3px solid #111111;
        font-size: 12px;
        color: #333333;
        text-align: right;
        width: 100%;
        box-sizing: border-box;
    }
</style>
</head>
